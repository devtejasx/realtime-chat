# realtime-chat virtual host.
#
# Replace `realtime-chat.example.com` with your domain, then obtain certificates
# with scripts/ssl/init-letsencrypt.sh. Until certificates exist, comment out the
# 443 server block (the HTTP block alone will proxy so you can bootstrap).

upstream chat_backend {
    server server:8080;
    keepalive 64;
}

# ---- HTTP: ACME challenge + redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name realtime-chat.example.com;

    # Let's Encrypt webroot challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: TLS termination + reverse proxy ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name realtime-chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/realtime-chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realtime-chat.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/realtime-chat.example.com/chain.pem;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # WebSocket endpoint — long-lived upgraded connections.
    location /ws {
        proxy_pass http://chat_backend;
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # keep idle sockets open for the heartbeat
        proxy_send_timeout 3600s;
    }

    # Health/readiness probes (kept cheap; no buffering needed).
    location = /health      { proxy_pass http://chat_backend; include /etc/nginx/snippets/proxy.conf; }
    location = /health/live { proxy_pass http://chat_backend; include /etc/nginx/snippets/proxy.conf; }
    location = /health/ready{ proxy_pass http://chat_backend; include /etc/nginx/snippets/proxy.conf; }

    # Metrics: restrict to internal networks (adjust CIDRs for your VPC).
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://chat_backend;
        include /etc/nginx/snippets/proxy.conf;
    }

    # REST API and everything else.
    location / {
        proxy_pass http://chat_backend;
        include /etc/nginx/snippets/proxy.conf;
    }
}
