# ---------------------------------------------------------------------------
# SonarQube / SonarCloud configuration.
#
# C++ analysis in Sonar requires a *build wrapper* run — Sonar cannot analyse C++
# from source alone, because it needs the real compiler invocations (include paths,
# macro definitions, standard level) to parse anything correctly. The sequence is:
#
#   build-wrapper-linux-x86-64 --out-dir build_wrapper_output \
#       cmake --build build --clean-first
#   sonar-scanner
#
# A scan run without that step silently analyses almost nothing and reports a
# reassuring, meaningless result.
# ---------------------------------------------------------------------------

sonar.projectKey=devtejasx_realtime-chat
sonar.projectName=realtime-chat
sonar.projectVersion=0.1.0
sonar.organization=devtejasx

# --- sources ---------------------------------------------------------------

sonar.sources=src,include
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Third-party and generated trees. Fetched dependencies would otherwise dominate
# both the line count and the issue list with problems nobody here can fix.
sonar.exclusions=\
  build/**,\
  build-*/**,\
  **/_deps/**,\
  deploy/**,\
  loadtest/**,\
  docs/**

# --- C++ analysis ----------------------------------------------------------

sonar.cfamily.build-wrapper-output=build_wrapper_output
sonar.cfamily.threads=4
# Analysis cache makes incremental scans dramatically faster in CI.
sonar.cfamily.cache.enabled=true
sonar.cfamily.cache.path=.sonar-cache

# --- coverage --------------------------------------------------------------
#
# Produced by scripts/coverage.sh. Sonar reads gcov output directly rather than
# lcov's aggregated .info file.
sonar.cfamily.gcov.reportsPath=build/coverage

# Coverage on these is not meaningful and would only distort the percentage:
#   - main.cpp is a thin entry point exercised by running the binary, not by tests
#   - application.cpp is the composition root; covering it means starting a real
#     server with a real database, which belongs in integration testing
#   - openapi_spec.cpp is a single string literal
#   - the Redis backends need a live Redis, so unit tests exercise the fallback
sonar.coverage.exclusions=\
  src/main.cpp,\
  src/application.cpp,\
  src/docs/openapi_spec.cpp,\
  src/cache/redis_cache_store.cpp,\
  src/realtime/redis_cluster_bus.cpp,\
  src/tracing/otlp_http_exporter.cpp

# --- duplication -----------------------------------------------------------
#
# The pg_*_repository translation units share a deliberate structural shape
# (column list, mapper, with_transaction wrapper). That repetition is the
# Repository pattern doing its job — collapsing it into a template would trade
# readable SQL for indirection — so it is excluded rather than chased.
sonar.cpd.exclusions=\
  src/repositories/pg_*.cpp,\
  tests/support/**

# --- quality gate ----------------------------------------------------------
#
# `new_code` rather than overall: gating on total coverage in an existing codebase
# either blocks every change or is set so low it means nothing. Gating on newly
# written lines is what actually raises quality over time.
sonar.newCode.referenceBranch=main
