# Basic continuous integration: configure, build, and run the test suite on
# every push and pull request to main. This is intentionally minimal — the
# full deploy pipeline (Docker image, AWS) is a later milestone. Its job is to
# catch build breaks and failing tests early.
#
# All third-party dependencies (Asio, Crow, GoogleTest) are fetched at
# configure time via FetchContent, so no system packages are needed beyond a
# C++20 compiler, CMake, and Ninja.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build & test (ubuntu, gcc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use CMake's default generator (Unix Makefiles) — always present on the
      # runner — so CI needs no extra package installs. Parallelise the build
      # across all available cores.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
