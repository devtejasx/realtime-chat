# Main Nginx configuration for the realtime-chat reverse proxy.
# Terminates TLS, proxies HTTP + WebSocket to the app, and applies compression
# and security headers. Server blocks live in conf.d/.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- access log (structured) ---
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer","user_agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id"}';
    access_log /var/log/nginx/access.log json_combined;

    # --- performance ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # --- request buffering / upload limits (matches app MAX_UPLOAD_BYTES) ---
    client_max_body_size 25m;
    client_body_buffer_size 128k;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json application/javascript application/xml
        text/plain text/css text/xml image/svg+xml;
    # brotli on;   # enable if the nginx build includes ngx_brotli

    # Map for the WebSocket Upgrade/Connection headers.
    # "upgrade" for a WebSocket handshake; *empty* — not "close" — for everything
    # else.
    #
    # Empty clears the header, which is what an upstream declaring `keepalive`
    # requires. Answering "close" here tells the app to hang up on a connection
    # nginx has simultaneously cached for reuse, and the next request sent down
    # it fails as "upstream prematurely closed connection". Enough of those in a
    # row trip max_fails and every upstream is marked down at once.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    include /etc/nginx/conf.d/*.conf;
}
