---
# Secret TEMPLATE — do not commit real values.
#
# This file exists to document the required keys and their shape. In any real
# deployment the values come from a secrets manager, not from git:
#
#   * AWS: External Secrets Operator or the Secrets Store CSI driver, backed by
#     AWS Secrets Manager (see deploy/terraform, which provisions the secret).
#   * Self-managed: Sealed Secrets or SOPS, so the encrypted form is safe in git.
#
# `stringData` (not `data`) is used deliberately: values are plain text rather
# than base64, which makes the template readable and removes an encoding step
# that is easy to get wrong. Kubernetes encodes them on write.
#
# Note that Kubernetes Secrets are only base64-encoded at rest unless encryption
# at rest is enabled on etcd. Enable it, and restrict `get secret` with RBAC.
apiVersion: v1
kind: Secret
metadata:
  name: realtime-chat-secrets
  labels:
    app.kubernetes.io/name: realtime-chat
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Database credentials.
  DB_USER: "chat"
  DB_PASSWORD: "REPLACE_ME"

  # JWT signing key.
  #
  # Config::validate() refuses to boot in production with the shipped default or
  # anything under 32 bytes, so a weak key fails loudly at startup rather than
  # quietly weakening every token. Generate with:
  #
  #     openssl rand -base64 48
  #
  # Rotating this invalidates every issued access and refresh token, logging all
  # users out — schedule it, and consider a dual-key window if that is not
  # acceptable.
  JWT_SECRET: "REPLACE_ME_WITH_AT_LEAST_32_RANDOM_BYTES"
