# Shared proxy parameters for forwarding to the app upstream, including the
# headers the app relies on for client IP and request correlation.

proxy_http_version 1.1;
# Resolves to "upgrade" on a WebSocket handshake and to empty otherwise (see the
# map in nginx.conf). Setting it here rather than per-location means every
# location that proxies gets the treatment the `keepalive` upstream requires —
# the health and metrics locations below were previously sending the default
# `Connection: close` upstream against a pool nginx intended to reuse.
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# Preserve an inbound request id or generate one for correlation across tiers.
proxy_set_header X-Request-Id $request_id;
proxy_buffering on;
proxy_request_buffering on;
