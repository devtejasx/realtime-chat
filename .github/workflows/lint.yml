name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Validate the workflow files themselves.
  #
  # A malformed workflow does not fail loudly — GitHub cannot parse it, so it
  # cannot read `name:` either, and the run surfaces as the bare file path with no
  # usable log. The specific trap is a duplicate mapping key: PyYAML's default
  # loader silently keeps the last value, while GitHub Actions rejects the file
  # outright. Hence the strict loader below.
  workflows:
    name: workflow syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml

          class Strict(yaml.SafeLoader):
              pass

          def no_duplicates(loader, node, deep=False):
              seen = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in seen:
                      raise yaml.constructor.ConstructorError(
                          None, None,
                          f"duplicate key {key!r} at line {key_node.start_mark.line + 1}",
                          key_node.start_mark)
                  seen[key] = loader.construct_object(value_node, deep=deep)
              return seen

          Strict.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_duplicates)

          failed = 0
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  document = yaml.load(open(path, encoding='utf-8'), Loader=Strict)
                  assert document.get('name'), f"{path}: missing top-level 'name'"
                  assert document.get('jobs'), f"{path}: no jobs defined"
                  print(f"ok      {path}")
              except Exception as exc:
                  failed += 1
                  print(f"BROKEN  {path}\n        {exc}")
          sys.exit(1 if failed else 0)
          PY

  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned, rather than `apt-get install clang-format`.
      #
      # clang-format's output changes between major versions, so an unpinned
      # formatter makes this check non-deterministic over time: the same commit
      # passes today and fails once the runner image bumps LLVM. Worse, a
      # contributor formatting locally with a different version cannot make the
      # check pass at all. The PyPI package ships pinned upstream binaries, so CI
      # and every developer run the identical formatter.
      #
      # Keep this version in step with docs/Contributing.md.
      - name: Install clang-format
        run: pipx install clang-format==20.1.8
      - name: Check formatting
        run: |
          find src include tests benchmarks -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    # Best-effort: static analysis over the codebase. Non-blocking so a new
    # advisory finding does not fail the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git clang-tidy \
            libssl-dev libpq-dev
      - name: Configure (generate compile_commands.json)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRTC_BUILD_TESTS=OFF
      - name: Run clang-tidy on sources
        run: |
          find src -name '*.cpp' \
            -print0 | xargs -0 -n1 -P2 clang-tidy -p build || true
