name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: realtime_chat
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat -d realtime_chat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Point the integration tests at the service container above.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: realtime_chat
      DB_USER: chat
      DB_PASSWORD: chat_password
      JWT_SECRET: ci-test-secret-value-please-ignore
      RTC_RUN_DB_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git \
            libssl-dev libpq-dev postgresql-server-dev-all

      - name: Cache CMake dependency downloads
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRTC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
