---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: realtime-chat
  labels:
    app.kubernetes.io/name: realtime-chat
# The application never calls the Kubernetes API, so it needs no token mounted.
# Disabling the automount removes a credential an attacker could otherwise use to
# pivot after compromising the container.
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-chat
  labels:
    app.kubernetes.io/name: realtime-chat
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: realtime-chat
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  # Session affinity is deliberately NOT set.
  #
  # A WebSocket connection is inherently sticky once established — it is a single
  # long-lived TCP connection to one pod — so affinity buys nothing there. And
  # because the Redis cluster bus fans broadcasts out to every replica, a client's
  # REST calls and its WebSocket connection do not need to land on the same pod.
  # Adding affinity would only skew load distribution.
  sessionAffinity: None
---
# Headless service, for direct per-pod addressing: useful for debugging a specific
# replica's /api/v1/admin/websockets view, which is inherently pod-local.
apiVersion: v1
kind: Service
metadata:
  name: realtime-chat-headless
  labels:
    app.kubernetes.io/name: realtime-chat
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: realtime-chat
  ports:
    - name: http
      port: 8080
      targetPort: http
