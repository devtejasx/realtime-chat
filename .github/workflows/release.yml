name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build artifacts & publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git \
            libssl-dev libpq-dev postgresql-server-dev-all

      - name: Build (Release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRTC_BUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Package artifact
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG="realtime-chat-${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG}"
          cp build/bin/realtime-chat "dist/${PKG}/"
          cp -r migrations "dist/${PKG}/"
          cp README.md LICENSE .env.example "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          sha256sum "dist/${PKG}.tar.gz" > "dist/${PKG}.tar.gz.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
