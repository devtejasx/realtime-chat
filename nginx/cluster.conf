# Load balancer for the local multi-instance stack (docker-compose.cluster.yml).
#
# Plain HTTP on :8080, no TLS — this is a development aid for observing
# cross-instance delivery, not a deployment template. For the production reverse
# proxy (TLS, HSTS, security headers, rate limiting) see nginx/nginx.conf and
# nginx/conf.d/.

upstream chat_backend {
    # Round-robin on purpose.
    #
    # The tempting alternative is ip_hash or a sticky cookie, which pins a client
    # to one instance and makes the app look correct even when the cluster bus is
    # dead — every one of a user's connections lands on the same process, so
    # local delivery covers it. Round-robin spreads a user's tabs across
    # instances, which is precisely the condition that exposes a broken fan-out.
    #
    # Note that stickiness is not required for correctness here: WebSocket
    # connections are long-lived and pinned to whichever instance accepted them,
    # and Redis Pub/Sub is what carries events to the others. Sessions live in
    # PostgreSQL, so an HTTP request may be answered by any instance.
    server server-a:8080 max_fails=3 fail_timeout=10s;
    server server-b:8080 max_fails=3 fail_timeout=10s;

    # Cached upstream connections. Worth knowing when testing: nginx prefers an
    # already-open connection, so a loop of *sequential* curl requests will
    # appear to stick to one instance. Issue them concurrently (or watch real
    # WebSocket clients, which are concurrent and long-lived by nature) and the
    # distribution shows up. Neither behaviour affects delivery — that is what
    # the cluster bus is for — but it does make a sequential loop a misleading
    # way to check the balancer.
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 25m;

    # Surfaces which instance answered, so a curl loop shows the balancer
    # actually alternating. The app also returns its own node id on
    # /health/ready.
    add_header X-Upstream $upstream_addr always;

    location / {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserved rather than regenerated, so one request id ties together the
        # balancer log and whichever instance handled it.
        proxy_set_header X-Request-Id      $http_x_request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    75s;
    }

    # WebSocket upgrade. Without these three lines the handshake is proxied as a
    # plain GET, the upgrade never completes, and every realtime feature fails in
    # a way that looks like an application bug.
    location /ws {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long enough to outlive the app's 30s heartbeat interval; a shorter
        # value would cut idle connections that are actually healthy.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Same treatment for the versioned WebSocket path.
    location /api/v1/ws {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Balancer's own liveness, answered without touching an upstream.
    location = /lb-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
